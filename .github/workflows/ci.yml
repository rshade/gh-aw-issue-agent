name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.93.5
      - name: Test, compile, smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: make test compile smoke
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
            !node_modules
            !.superpowers
